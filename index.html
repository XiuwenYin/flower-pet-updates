<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓶中花</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#f4f1ea; --card:#fffdf8; --ink:#2b2824; --muted:#857d72; --line:#e4ddd0; --acc:#8c3b2f; --acc-ink:#fff }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1b19; --card:#262320; --ink:#eee8de; --muted:#a39a8d; --line:#3a3530; --acc:#c06a58; --acc-ink:#1d1b19 } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px 28px 26px }
  .head { display:flex; align-items:center; gap:14px }
  .head img { width:56px; height:56px; border-radius:12px }
  h1 { margin:0; font-size:22px; font-weight:600 }
  .ver { color:var(--muted); font-size:13px }
  .sys { margin:26px 0 10px; font-size:14px; color:var(--muted) }
  .sys b { color:var(--ink); font-weight:600 }
  .btn { display:block; text-align:center; padding:12px 16px; border-radius:10px; background:var(--acc); color:var(--acc-ink);
    text-decoration:none; font-weight:600; font-size:16px }
  .btn:hover { filter:brightness(1.06) }
  .tip { margin:12px 0 0; font-size:13px; color:var(--muted) }
  .notes { margin:22px 0 0; padding-top:18px; border-top:1px solid var(--line); font-size:13.5px }
  .notes b { display:block; font-weight:600; margin-bottom:4px }
  .alt { margin:8px 0 0; font-size:13px; text-align:center }
  .alt a { color:var(--muted) }
  .other { margin:20px 0 0; font-size:13px; color:var(--muted) }
  .other a { color:var(--ink); margin-right:14px }
  .cmd { margin:16px 0 0; font-size:13px; color:var(--muted) }
  .cmd div { display:flex; gap:8px; margin-top:6px }
  .cmd code { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--ink) }
  .cmd button { flex:none; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:none; color:var(--ink); font:inherit; cursor:pointer }
  [hidden] { display:none !important }
</style>
</head>
<body>
<main>
  <div class="head"><img src="icon.png" alt=""><div><h1>瓶中花</h1><div class="ver" id="ver"></div></div></div>
  <p class="sys" id="sys"></p>
  <a class="btn" id="btn" hidden></a>
  <p class="tip" id="tip" hidden></p>
  <p class="alt"><a id="alt" hidden></a></p>
  <div class="cmd" id="cmd" hidden><span id="cmdL"></span><div><code id="cmdT"></code><button id="copy"></button></div></div>
  <div class="notes" id="notes" hidden><b id="notesL"></b><span id="notesT"></span></div>
  <p class="other" id="other"></p>
</main>
<script>
// 浏览器语言是中文时用中文，其余用英文
const ZH = /^zh/i.test(navigator.language || '');
const T = ZH ? {
  name: '瓶中花', title: '瓶中花 · 下载', ver: '版本', you: '你的电脑：', other: '其他版本：', alt: '备用下载地址', notes: '本版更新',
  cmd: '也可以在“终端”里运行这行命令安装，打开时不会被拦：', copy: '复制', copied: '已复制', none: '瓶中花支持Mac和Windows电脑，请在电脑上打开本页下载。',
  btn: { 'darwin-arm64': '下载Apple芯片版', 'darwin-x64': '下载Intel芯片版', 'win32-x64': '下载Windows版' },
  names: { 'darwin-arm64': 'Mac（Apple芯片）', 'darwin-x64': 'Mac（Intel芯片）', 'win32-x64': 'Windows' },
  tips: { darwin: '把瓶中花拖进「应用程序」后打开。如提示无法验证开发者，打开「系统设置 › 隐私与安全性」，在页面下方点「仍要打开」。', win32: '如出现「Windows 已保护你的电脑」，点「更多信息」，再点「仍要运行」。' },
} : {
  name: 'Flowers in a Vase', title: 'Download Flowers in a Vase', ver: 'Version ', you: 'Your computer: ', other: 'Other versions: ', alt: 'Alternative download link', notes: 'What’s new',
  cmd: 'Or install it by running this command in Terminal, which avoids the security prompt:', copy: 'Copy', copied: 'Copied', none: 'Flowers in a Vase runs on Mac and Windows. Open this page on your computer to download it.',
  btn: { 'darwin-arm64': 'Download for Apple silicon', 'darwin-x64': 'Download for Intel Mac', 'win32-x64': 'Download for Windows' },
  names: { 'darwin-arm64': 'Mac (Apple silicon)', 'darwin-x64': 'Mac (Intel)', 'win32-x64': 'Windows' },
  tips: { darwin: 'Drag Flowers in a Vase into Applications, then open it. If macOS says it can’t verify the developer, open System Settings › Privacy & Security and click “Open Anyway” near the bottom.', win32: 'If you see “Windows protected your PC”, click “More info”, then “Run anyway”.' },
};
const BTN = T.btn, NAMES = T.names, TIPS = T.tips;
document.documentElement.lang = ZH ? 'zh-CN' : 'en'; document.title = T.title;
document.querySelector('h1').textContent = T.name; document.getElementById('alt').textContent = T.alt;
document.getElementById('cmdL').textContent = T.cmd; document.getElementById('copy').textContent = T.copy; document.getElementById('notesL').textContent = T.notes;
// 更新源：标了bin的（国内镜像）上有安装包，放在releases/v版本/文件名
const FEEDS = [{"url":"https://yqkjtech.com/flower/","bin":true},{"url":"https://xiuwenyin.github.io/flower-pet-updates/","bin":false}];
const here = FEEDS.find(f => location.href.startsWith(f.url));
const mirror = FEEDS.find(f => f.bin);
// 在国内（按时区判断）时优先用镜像
const inCN = /^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Chungking)$/.test(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
const nameOf = u => decodeURIComponent(new URL(u).pathname.split('/').pop());
// 某个平台的下载地址：[首选, 备用]
function links(s, key) {
  const gh = s.files[key], mu = mirror && `${mirror.url}releases/v${s.version}/${nameOf(gh)}`;
  if (!mu) return [gh];
  return (here && here.bin) || inCN ? [mu, gh] : [gh, mu];
}
async function detect() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return null;
  if (/Windows/.test(ua)) return { key: 'win32-x64', sure: true };
  if (!/Macintosh|Mac OS X/.test(ua)) return null;
  try {
    const h = await navigator.userAgentData?.getHighEntropyValues?.(['architecture']);
    if (h?.architecture) return { key: h.architecture === 'arm' ? 'darwin-arm64' : 'darwin-x64', sure: true };
  } catch (e) { }
  try {
    const gl = document.createElement('canvas').getContext('webgl'), ext = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    if (/Apple M\d/.test(r)) return { key: 'darwin-arm64', sure: true };
    if (/Intel|AMD|Radeon|NVIDIA/i.test(r)) return { key: 'darwin-x64', sure: true };
  } catch (e) { }
  return { key: 'darwin-arm64', sure: false };   // Safari不报芯片型号；2020年以后的Mac多是Apple芯片
}
(async () => {
  const m = await (await fetch('manifest.json', { cache: 'no-store' })).json(), s = m.shell, me = await detect();
  document.getElementById('ver').textContent = T.ver + s.version;
  const notes = ZH ? s.notes : s.notesEn;
  if (notes) { document.getElementById('notesT').textContent = notes; document.getElementById('notes').hidden = false; }
  const sys = document.getElementById('sys'), btn = document.getElementById('btn'), tip = document.getElementById('tip');
  if (me && s.files[me.key]) {
    sys.innerHTML = T.you + '<b>' + (me.sure ? NAMES[me.key] : 'Mac') + '</b>';
    const [a, b] = links(s, me.key);
    btn.href = a; btn.textContent = BTN[me.key]; btn.hidden = false;
    if (b) { const alt = document.getElementById('alt'); alt.href = b; alt.hidden = false; }
    tip.textContent = TIPS[me.key.split('-')[0]]; tip.hidden = false;
    if (me.key.startsWith('darwin')) {
      const c = 'curl -fsSL ' + new URL('install.sh', inCN && mirror ? mirror.url : location.href) + ' | sh';
      document.getElementById('cmdT').textContent = c; document.getElementById('cmd').hidden = false;
      const b = document.getElementById('copy');
      b.onclick = () => navigator.clipboard.writeText(c).then(() => { b.textContent = T.copied; setTimeout(() => b.textContent = T.copy, 1500); });
    }
  } else sys.textContent = T.none;
  document.getElementById('other').innerHTML = (me ? T.other : '') +
    Object.keys(NAMES).filter(k => s.files[k] && (!me || k !== me.key)).map(k => `<a href="${links(s, k)[0]}">${NAMES[k]}</a>`).join('');
})();
</script>
</body>
</html>
